# my tmux conf
# vim: set foldmarker={,} foldlevel=0 foldmethod=marker:

# sep char: ⟨⟩
TX_SEP_L=⟨
TX_SEP_R=⟩

# color plate {
# Catppuccin Macchiato
CP_BASE="#24273a"
CP_SURFACE1="#494d64"
CP_SURFACE2="#5b6078"
CP_SUBTEXT0="#a5adcb"
CP_TEXT="#cad3f5"
CP_BLUE="#8aadf4"
CP_TEAL="#8bd5ca"
CP_PEACH="#f5a97f"
CP_GREEN="#a6da95"
CP_RED="#ed8796"
CP_YELLOW="#eed49f"
CP_ROSEWATER="#f4dbd6"

# fg、bg 用空白分隔，逗號會切斷 #{?,,} 條件式
TX_C_S="fg=$CP_TEXT bg=$CP_SURFACE1"        # 狀態列
TX_C_SL1="fg=$CP_BASE bg=$CP_BLUE"          # session
TX_C_PREFIX="fg=$CP_BASE bg=$CP_PEACH"
TX_C_SL3="fg=$CP_BASE bg=$CP_TEAL"          # 目前 window
TX_C_SR1="fg=$CP_TEXT bg=$CP_SURFACE2"      # 時鐘
TX_C_SR2="fg=$CP_SUBTEXT0 bg=$CP_SURFACE1"  # 系統資訊
TX_C_W="fg=$CP_BASE bg=$CP_ROSEWATER"       # copy-mode 選取
TX_C_MSG="fg=$CP_BASE bg=$CP_YELLOW"
TX_C_ACT="fg=$CP_BASE bg=$CP_GREEN"
TX_C_BELL="fg=$CP_BASE bg=$CP_RED"

TX_C_B=$CP_SURFACE1                         # pane 邊框
TX_C_BA=$CP_BLUE                            # 作用中 pane 邊框
TX_C_CLOCK=$CP_BLUE
# }

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh

# listen to alerts from all windows
set-option -g bell-action any

# set history up to 100000
set -g history-limit 100000

set -g focus-events on

# enable mouse
set -g mouse on

# rename title
set -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P:#W'

# start index from 1
set -g base-index 1
set -g pane-base-index 1

# status bar {
set -g status-interval 1
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 60
set -g status-style "$TX_C_S"

# 圖示兼作 prefix 指示
SL_ICON_OFF="#[$TX_C_SL1] ⬡ "
SL_ICON_ON="#[$TX_C_PREFIX] ⬢ "
SL_ICON="#{?client_prefix,${SL_ICON_ON},${SL_ICON_OFF}}"
SL_SESSION="#[$TX_C_SL1]#S "
SL_TAIL="#[$TX_C_SL3]$TX_SEP_R"

set -g status-left "${SL_ICON}${SL_SESSION}${SL_TAIL}"

set -g status-right \
"#[$TX_C_SR2] #(cut -d ' ' -f 1-3 /proc/loadavg) $TX_SEP_L\
#[$TX_C_SR2] #(free -h | grep Mem | awk '{ print $3\"/\"$2 }') $TX_SEP_L\
#[$TX_C_SR1] %a %d %b %H:%M:%S"
# }

# windows status {
# 格式：<目錄basename>·<程式名>，跑 shell 時省略「·程式名」，copy-mode 時程式名換成 copy。
WN_PATH="#{=/12/…:#{b:pane_current_path}}"                              # 目錄 basename，截 12 字
WN_CMD="#{?#{m:*sh,#{pane_current_command}},,·#{pane_current_command}}" # 非 shell 才附「·程式」

# window name（#W，供終端標題與 choose-tree）：非即時，靠 pane 指令變化觸發更新。
set -g automatic-rename-format "${WN_PATH}${WN_CMD}#{?pane_dead,[dead],}"

WN_SUFFIX="#{?#{==:#{pane_mode},copy-mode},·copy,${WN_CMD}}"          # copy 優先，否則同 WN_CMD
WINDOW="#I)${WN_PATH}${WN_SUFFIX}#F"

setw -g window-status-format " $WINDOW"
setw -g window-status-current-style "$TX_C_SR1"
setw -g window-status-current-format "#[$TX_C_SL3]$TX_SEP_R$WINDOW$TX_SEP_R"

# 監看背景 window 的活動與鈴聲，只在 status bar 上色標記，不彈訊息干擾工作
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-activity off
setw -g window-status-activity-style "$TX_C_ACT,blink"
setw -g window-status-bell-style "$TX_C_BELL,blink"
# }

# messaging color {
set -g message-style "$TX_C_MSG"
# }

# window mode color {
setw -g mode-style "$TX_C_W"
setw -g clock-mode-colour $TX_C_CLOCK
# }

# pane {
set -g pane-border-style fg=$TX_C_B,bg=default
set -g pane-active-border-style fg=$TX_C_BA,bg=default
# }

# copy mode {
# vim like key mapping
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
# }

# key bindings {

# new prefix
unbind-key C-b
set -g prefix C-q
bind-key C-q send-prefix

# <prefix> + r | reloading config
bind-key r source-file ~/.tmux.conf \; display-message "Yo~! .tmux.conf reloaded!"

# edit tmux.conf
unbind e
bind e new-window -n '~/.tmux.conf' "sh -c 'vim ~/.tmux.conf && tmux source ~/.tmux.conf'"

# split window with | and -
bind-key \\ split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# move between windows
bind-key -n C-PageUp   previous-window
bind-key -n C-PageDown next-window

# prefix w | 樹狀選單快速切 window：停在 window 層（不下鑽到 pane）
#bind-key w choose-tree -w

# split small sidebar
bind-key h split-window -h -b -l 20% -c '#{pane_current_path}'
bind-key l split-window -h -l 20% -c '#{pane_current_path}'
bind-key j split-window -v -l 20% -c '#{pane_current_path}'
bind-key k split-window -v -b -l 20% -c '#{pane_current_path}'

bind-key C-j resize-pane -D 20
bind-key C-k resize-pane -U 20
bind-key C-h resize-pane -L 20
bind-key C-l resize-pane -R 20

# claude code
bind-key C-s display-popup -E -w 100 -h 18 -T ' Claude Sessions ' "~/.claude/hooks/claude-tmux-picker.sh"

# vim-tmux-navigator {
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l
# }

# }

# Import config by different OS
if-shell 'test "$(uname -s)" = Darwin' 'source-file ~/.tmux.osx.conf'
if-shell 'test "$(uname -s)" = Linux' 'source-file ~/.tmux.linux.conf'
