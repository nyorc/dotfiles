# .tmux.oxs.conf

set -g status-right \
"#[fg=$TX_C_SR3_F]#[bg=$TX_C_SR3_B] #(tmux-mem-cpu-load -g 5 --color -q) \
#[fg=$TX_C_SR1_F]#[bg=$TX_C_SR1_B] %H:%M:%S"

# Unbind from non-macOS setup
unbind-key -T copy-mode-vi 'y'
# Copy now goes to macOS clipboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# popup 用到的 fzf/jq 首次執行要付 macOS 程式碼簽章驗證成本（實測 fzf 0.57s、jq 0.17s，
# 第二次起都是 0.00s），attach 時先在背景各跑一次，第一次開 popup 就不必等。
set-hook -ag client-attached 'run-shell -b "fzf --version >/dev/null 2>&1; jq --version >/dev/null 2>&1"'
